---
galaxy_info:
  author: nipil
  description: >-
    Installs opencode, and dedicated user and ssh key to connect to.
    Adds a empty git repository, and setup a systemd service for gitweb.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - jammy
        - noble
  galaxy_tags:
    - opencode
    - gitweb

# these depenencies are only used for galaxy auto-install signal
# where transitive dependencies are found and fetched
#
# but ansible runds dependencies before the parent role's task
# which is a "meta-dependency" ... which carries no vars !
#
# and when it does so, it is not "populated" with variables
# so in our case, the user_ssh role would be failing validation,
# preventing the second "real" populated run to ever happen.
#
# So to prevent this "empty invocation", do not list the role
# in the meta dependency
dependencies: []
