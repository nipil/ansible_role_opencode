---
galaxy_info:
  author: nipil
  description: >-
    Installs opencode, and dedicated user and ssh key to connect to.
    Adds a empty git repository, and setup a systemd service for gitweb.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - jammy
        - noble
  galaxy_tags:
    - opencode
    - gitweb
dependencies:
  - src: https://github.com/nipil/ansible_role_user_ssh.git
    version: v1.2.0
