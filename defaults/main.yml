---
opencode_mise_spec: aqua:anomalyco/opencode@latest

opencode_home: /opt/opencode
opencode_user_authorized_keys: []

# wether to install the helper script or not, and where to install it
opencode_helper_install: false
opencode_helper_install_on_controller: true
opencode_helper_install_folder: /tmp

opencode_mise_shell_rcfile: .bashrc
opencode_shell: /bin/bash
# https://codeberg.org/dnkl/foot/issues/2335
# for versions of foot until 1.27 foot crashes on opencode
# so "protect" the terminal by running inside a tmux
# opencode_shell: /usr/bin/tmux

# https://opencode.ai/docs/providers/#credentials
opencode_auth:
# provider_name:
#   type:
#   ...

opencode_model:
  # recent:
  #   - providerID: openai
  #     modelID: gpt-5.3-codex
  # favorite: []
  # variant:
  #   openai/gpt-5.3-codex: default
