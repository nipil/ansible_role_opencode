- name: Setup requested shell
  ansible.builtin.apt:
    name: "{{ opencode_shell | basename }}"
    state: present

- name: Setup opencode user
  ansible.builtin.group:
    name: "{{ opencode_user }}"
    state: present

- name: Setup opencode user
  ansible.builtin.user:
    name: "{{ opencode_user }}"
    group: "{{ opencode_user }}"
    shell: "{{ opencode_shell }}"
    home: "{{ opencode_home }}"
    password_lock: true
    state: present

- name: Setup ansible temporary directory
  ansible.builtin.file:
    path: "{{ opencode_home }}/.ansible/tmp"
    mode: "0700"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_user }}"
    state: directory

- name: Setup shell run by tmux
  when: "'tmux' in opencode_shell"
  ansible.builtin.copy:
    content: "set-option -g default-shell /bin/bash"
    dest: "{{ opencode_home }}/.tmux.conf"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_user }}"
    mode: "0644"

- name: Setup user ssh login
  vars:
    user_ssh_name: "{{ opencode_user }}"
    user_ssh_keys: "{{ opencode_user_authorized_keys }}"
  ansible.builtin.import_role:
    name: user_ssh
