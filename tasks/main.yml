---
- name: Validate configuration
  tags: always
  ansible.builtin.import_tasks:
    file: validate.yml

- name: Setup user
  ansible.builtin.import_tasks:
    file: user.yml

- name: Setup mise-en-place
  ansible.builtin.include_role:
    name: mise

- name: Setup auxiliary packages
  ansible.builtin.apt:
    name: "{{ opencode_additional_packages }}"
    state: present

# git instaweb starts unprivileged on port 1234
# with a generated configuration for the repo dir
- name: Stop and disable default lighttpd
  ansible.builtin.systemd_service:
    name: lighttpd
    state: stopped
    enabled: false
    masked: true

- name: Setup working repository
  tags: repo
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.import_tasks:
    file: repository.yml

- name: Setup working repository
  tags: webui
  become: true
  ansible.builtin.import_tasks:
    file: git-webui.yml

- name: Setup opencode
  become: true
  become_user: "{{ opencode_user }}"
  block:
    - name: Install opencode with mise
      ansible.builtin.command:
        creates: "{{ opencode_mise_shim }}"
        argv:
          - mise
          - use
          - --global
          - "{{ opencode_mise_spec }}"

    - name: Activate mise in shell rc
      ansible.builtin.lineinfile:
        path: "{{ opencode_home }}/{{ opencode_mise_shell_rcfile }}"
        line: eval "$(mise activate bash)"
        state: present

    - name: Configure opencode
      ansible.builtin.import_tasks:
        file: configure.yml

- name: Install helper on controller
  when: opencode_helper_install | bool
  run_once: "{{ opencode_helper_install_on_controller }}"
  delegate_to: "{{ opencode_helper_install_on_controller | ternary('localhost', inventory_hostname) }}"
  ansible.builtin.copy:
    src: "{{ opencode_helper_name }}"
    dest: "{{ opencode_helper_install_folder }}/"
    mode: "0755"
