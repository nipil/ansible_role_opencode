# TODO: verify that user exists
---
- name: Validate opencode_user
  ansible.builtin.assert:
    that:
      - opencode_user is defined
      - opencode_user is string
    fail_msg: "opencode_user must be a string."

- name: Validate opencode_archive_sha256
  ansible.builtin.assert:
    that:
      - opencode_archive_sha256 is defined
      - opencode_archive_sha256 is string
    fail_msg: "opencode_archive_sha256 must be a string."

- name: Validate opencode_home
  ansible.builtin.assert:
    that:
      - opencode_home is defined
      - opencode_home is string
    fail_msg: "opencode_home must be a string."

- name: Validate opencode_user_authorized_keys
  ansible.builtin.assert:
    that:
      - opencode_user_authorized_keys is defined
      - opencode_user_authorized_keys is sequence
      - opencode_user_authorized_keys is not string
    fail_msg: "opencode_user_authorized_keys must be a list."

- name: Validate opencode_auth
  ansible.builtin.assert:
    that:
      - opencode_auth is defined
      - opencode_auth is mapping
    fail_msg: "opencode_auth must be a mapping."

- name: Validate opencode_model
  ansible.builtin.assert:
    that:
      - opencode_model is defined
      - opencode_model is mapping
    fail_msg: "opencode_model must be a mapping."
